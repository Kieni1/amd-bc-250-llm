name: Source validation

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

env:
  LANG: C
  LC_ALL: C

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: Install source-validation tools
        run: |
          dnf --disable-repo=fedora-cisco-openh264 install -y \
            bash findutils git-core python3 ruff ShellCheck

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run deterministic source validation
        run: |
          make lint
          make validate

      - name: Explain release-build authority
        run: |
          echo 'RPM release artifacts are intentionally built only on the Fedora 44 maintainer workstation.'
          echo 'Run ./build-local.sh --full there for the authoritative release gate.'
