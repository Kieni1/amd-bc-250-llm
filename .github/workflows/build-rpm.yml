name: Build Fedora RPM

on:
  workflow_dispatch:
    inputs:
      release_authority:
        description: Mark this exact workflow-dispatch run as the selected release artifact authority
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-rpm-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

env:
  LANG: C
  LC_ALL: C
  BC250_REQUIRE_GIT_SOURCE: "1"
  BC250_BUILD_IMAGE_REF: "fedora:44"
  BC250_RELEASE_AUTHORITY: ${{ github.event_name == 'workflow_dispatch' && inputs.release_authority && 'true' || 'false' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: fedora:44

    steps:
      - name: Install build tools
        run: |
          dnf --disable-repo=fedora-cisco-openh264 --setopt=install_weak_deps=False install -y \
            bash cargo coreutils cpio curl diffutils findutils gawk gcc git-core grep gzip make sed \
            libdrm-devel patch python3 rpm-build rpmlint ruff rust ShellCheck shadow-utils \
            systemd systemd-rpm-macros tar util-linux xz

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Fedora RPM gate as unprivileged builder
        run: |
          useradd --no-create-home --home-dir /tmp/bc250-builder --shell /bin/bash bc250-builder
          mkdir -p /tmp/bc250-builder
          chown bc250-builder:bc250-builder /tmp/bc250-builder
          chown -R bc250-builder:bc250-builder "$GITHUB_WORKSPACE"
          runuser -u bc250-builder -- env \
            HOME=/tmp/bc250-builder \
            LANG="$LANG" LC_ALL="$LC_ALL" \
            BC250_REQUIRE_GIT_SOURCE="$BC250_REQUIRE_GIT_SOURCE" \
            BC250_BUILD_IMAGE_REF="$BC250_BUILD_IMAGE_REF" \
            BC250_RELEASE_AUTHORITY="$BC250_RELEASE_AUTHORITY" \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_SHA="$GITHUB_SHA" \
            GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_WORKFLOW="$GITHUB_WORKFLOW" \
            GITHUB_WORKFLOW_REF="$GITHUB_WORKFLOW_REF" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            GITHUB_REF="$GITHUB_REF" \
            make release-gate

      - name: Upload binary RPM evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bc250-llm-server-binary-rpm
          path: |
            dist/*.x86_64.rpm
            dist/SHA256SUMS.binary
            dist/SHA256SUMS.inputs
            dist/release-evidence.json

      - name: Upload source RPM evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bc250-llm-server-source-rpm
          path: |
            dist/*.src.rpm
            dist/SHA256SUMS.source
            dist/SHA256SUMS.inputs
            dist/release-evidence.json
      - name: Upload selected release authority record
        if: env.BC250_RELEASE_AUTHORITY == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bc250-llm-server-release-selection
          path: |
            dist/release-selection.json
            dist/release-evidence.json
            dist/SHA256SUMS.binary
            dist/SHA256SUMS.source
            dist/SHA256SUMS.inputs

      - name: Run advisory remaining quality report
        if: always()
        continue-on-error: true
        run: |
          runuser -u bc250-builder -- env \
            HOME=/tmp/bc250-builder \
            LANG="$LANG" LC_ALL="$LC_ALL" \
            BC250_REQUIRE_GIT_SOURCE=0 \
            BC250_RELEASE_AUTHORITY=false \
            make quality-report

      - name: Upload advisory quality report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: bc250-llm-server-quality-report
          if-no-files-found: ignore
          path: |
            build/quality-report.txt
            build/rpmlint-report.txt
